<text x="48.00" y="930.00" font-family="Nunito Sans" font-size="13" font-weight="500" fill="#6A5E52">No extra degree numbers are given as a standard. PRG: vertical is essentially perpendicular to the ground; a slab is less than vertical; an overhang is steeper than vertical.</text>
<text x="48.00" y="950.00" font-family="Nunito Sans" font-size="13" font-weight="500" fill="#6A5E52">The three lean directions are drawn from that article’s definitions. The article’s own photographs could not be retrieved from this environment (the image URLs returned 404), so the check is against the published wording.</text>
