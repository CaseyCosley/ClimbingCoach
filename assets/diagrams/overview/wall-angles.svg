  <title id="t">Wall angles</title>
  <desc id="d">Three side views with the climber’s side on the left: slab leans away, vertical is perpendicular to the floor, overhang leans toward the climber.</desc>
  <rect width="1600" height="980" fill="#FFF9F1"/>
<text x="48.00" y="52.00" font-family="Fraunces" font-size="28" font-weight="650" fill="#2A241C">Wall angles</text>
<text x="48.00" y="74.00" font-family="Nunito Sans" font-size="14" font-weight="500" fill="#6A5E52">Climber’s side is on the left of each panel. Terms follow Philadelphia Rock Gyms’ indoor-wall article: vertical is essentially perpendicular to the floor.</text>
