<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curricula by Age Group · Youth Climbing Coaching Hub</title>
<meta name="description" content="September–June youth climbing curricula for seven age groups, with week-by-week vocabulary and timed activity plans.">
<meta name="theme-color" content="#8e4632">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="main" tabindex="-1">
<noscript><p class="noscript">This site needs JavaScript to load its data files.</p></noscript>

<div class="page-head">
  <h1>Curricula</h1>
  <a class="how-link" href="about.html#curricula">How this works</a>
</div>
<section class="card no-print tool-bar" id="picker">
  <label class="field" for="group">Age group<select id="group"></select></label>
  <div id="this-week"></div>
  <div class="view-switch" id="view-switch" role="tablist" aria-label="How to read the year">
    <button type="button" role="tab" data-view="lesson">This week</button>
    <button type="button" role="tab" data-view="roadmap">Roadmap</button>
    <button type="button" role="tab" data-view="months">Months</button>
    <button type="button" role="tab" data-view="ladder">Ladder</button>
    <button type="button" role="tab" data-view="table">Table</button>
  </div>
</section>
<div id="view-host"></div>
<section class="no-print"><h2>Typical session (<span id="session-min"></span> min)</h2><div id="session"></div></section>
<section class="no-print"><h2>Games each month (Library names)</h2><div id="games"></div></section>
<section class="no-print"><h2>Coach notes</h2><div id="notes"></div></section>
<section class="no-print"><h2>Related</h2><div id="related"></div></section>

</main>
<footer id="site-footer"></footer>
<script src="assets/js/common.js"></script>
<script src="assets/js/curricula.js"></script>
</body>
</html>
