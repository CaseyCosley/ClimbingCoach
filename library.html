<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · Climbing Coach</title>
<meta name="description" content="Search youth climbing activities and terms. Filter by discipline, age, type, skill and theme.">
<meta name="theme-color" content="#1F7A70">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="main" tabindex="-1">
<noscript><p class="noscript">This site needs JavaScript to load its data files.</p></noscript>

<div class="page-head">
  <h1>Library</h1>
  <a class="how-link" href="about.html#library">How this works</a>
</div>
<nav class="discipline" id="disc-nav" aria-label="Discipline"></nav>
<div class="toolbar" role="search">
  <label class="field" for="q">Search<input type="search" id="q" placeholder="Name, alias or description" autocomplete="off"></label>
  <label class="field" for="f-age">Age<select id="f-age"></select></label>
  <label class="field" for="f-type">Type<select id="f-type"></select></label>
  <label class="field" for="f-skill">Skill<select id="f-skill"></select></label>
</div>
<label class="field" for="f-theme" style="max-width:220px;margin-bottom:14px">Theme<select id="f-theme"></select></label>
<div class="btn-row no-print"><button type="button" class="btn ghost" id="reset">Clear filters</button></div>
<p class="result-line" id="count" aria-live="polite"></p>
<div id="results"></div>
<div id="term-hits"></div>

</main>
<footer id="site-footer"></footer>
<script src="assets/js/common.js"></script>
<script src="assets/js/library.js"></script>
</body>
</html>
